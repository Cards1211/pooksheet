<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFB7C5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A3323">
  <script>
    // Apply a chosen theme before first paint; the saved profile confirms it after the data loads.
    try {
      var t = localStorage.getItem('training-theme');
      var bg = { light: '#FFB7C5', dark: '#0A3323', barnacles: '#9693D6' }[t];
      if (bg) {
        document.documentElement.setAttribute('data-theme', t);
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', bg); });
      }
    } catch (e) { /* storage blocked: the app applies the theme after loading */ }
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PookSheet">
  <meta name="application-name" content="PookSheet">
  <meta name="app-version" content="__VERSION__">
  <title>PookSheet</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-today" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/></symbol>
    <symbol id="i-program" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="i-progress" viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-6M20.5 20H3.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 18-6-6 6-6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9.5 18 6-6-6-6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
    <symbol id="i-up-arrow" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-down-arrow" viewBox="0 0 24 24"><path d="M12 5v14M18 13l-6 6-6-6"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.5 5.1 5.6.8-4 4 .9 5.6-5-2.6-5 2.6.9-5.6-4-4 5.6-.8z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></symbol>
  </svg>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Main" hidden>
    <a class="tab" href="#/today" data-tab="today"><span class="tab-pill"><svg class="icon" aria-hidden="true"><use href="#i-today"/></svg></span>Today</a>
    <a class="tab" href="#/program" data-tab="program"><span class="tab-pill"><svg class="icon" aria-hidden="true"><use href="#i-program"/></svg></span>Program</a>
    <a class="tab" href="#/progress" data-tab="progress"><span class="tab-pill"><svg class="icon" aria-hidden="true"><use href="#i-progress"/></svg></span>Progress</a>
    <a class="tab" href="#/settings" data-tab="settings"><span class="tab-pill"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></span>Settings</a>
  </nav>

  <div class="rest-bar" id="rest-timer" hidden></div>
  <dialog class="rest-sheet" id="rest-sheet" aria-label="Rest timer"></dialog>
  <div class="rest-flash" id="rest-flash" aria-hidden="true"></div>
  <div class="sr-only" id="rest-live" role="status" aria-live="assertive"></div>

  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">This app needs JavaScript turned on.</p></noscript>
</body>
</html>
